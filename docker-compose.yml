version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fleetflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fleetflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleetflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fleetflow-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/fleetflow
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-production-fleetflow-secret-key-change-in-env}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:80"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fleetflow-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
